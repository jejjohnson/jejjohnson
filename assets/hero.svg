<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 612" width="1140" height="612" role="img" aria-label="The vision: observations from any sensor flow through GeoStack into differentiable physics (GeoModels) and inference (GeoML), built on GeoNumerics, and out as decisions with uncertainty; gradients flow back end to end. Two case studies instantiate it: methane, from radiance to emission rate, and sea surface height, from altimetry tracks to gap-free maps." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m0369a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="m0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m7e22ce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e22ce"/></marker></defs><rect x="0.5" y="0.5" width="1139" height="611" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="30.0" y="40.0" font-size="19" fill="#1e293b" text-anchor="start" font-weight="700">From observations to decisions, differentiable end to end</text><text x="30.0" y="62.0" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">one stack of small JAX libraries · layers import downward only · every step has a test oracle</text><rect x="30.0" y="92.0" width="190.0" height="250.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="48.0" y="120.0" font-size="15" fill="#1d4ed8" text-anchor="start" font-weight="700">Observe</text><text x="48.0" y="140.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="4