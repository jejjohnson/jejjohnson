<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 834" width="1180" height="834" role="img" aria-label="GeoStack along the data-maturity axis. Top, the science axis: L0 unstructured observations to L5 derived products, observations up to L2 and model states from L3. Two case studies run along it: methane from radiance to emission rate, and sea surface height from altimeter tracks to reanalysis. Middle, the compute that makes each step, each following the same ladder from simple model to amortized inference. Bottom, the engineering axis: store, index, read, carry, patch, transform and compose, with the carrier switching from geoarray to xarray at L3." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs><rect x="0.5" y="0.5" width="1179" height="833" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="30.0" y="42.0" font-size="20" fill="#1e293b" text-anchor="start" font-weight="700">GeoStack: one stack along the data-maturity axis</text><text x="30.0" y="64.0" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">science says what each level means · engineering says how it is stored, carried and composed · compute is the step between levels</text><text x="402.0" y="98.0" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">observations</text><text x="812.0" y="98.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">model states</text><text x="1058.0" y="98.0" font-size="12" fill="#be123c" text-anchor="middle" font-weight="700">decisions</text><rect x="20.0" y="106.0" width="1140.0" height="228.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="34.0" y="136.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="800">SCIENCE</text><text x="34.0" y="154.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">what is measured</text><text x="34.0" y="169.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">and modelled</text><rect x="170.0" y="118.0" width="136.0" height="64.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="182.0" y="138.0" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="800">L0</text><text x="182.0" y="156.0" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="700">Unstructured</text><text x="182.0" y="172.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">raw instrument</text><path d="M308.0,150.0 L332.0,150.0" fill="none" stroke="#1e293b" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="334.0" y="118.0" width="136.0" height="64.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="346.0" y="138.0" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="800">L1</text><text x="346.0" y="156.0" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="700">Structured</text><text x="346.0" y="172.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">calibrated radiance</text><path d="M472.0,150.0 L496.0,150.0" fill="none" stroke="#1e293b" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="498.0" y="118.0" width="136.0" height="64.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="510.0" y="138.0" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="800">L2</text><text x="510.0" y="156.0" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="700">Retrieved</text><text x="510.0" y="172.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">per-pixel geophysics</text><path d="M636.0,150.0 L660.0,150.0" fill="none" stroke="#1e293b" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="662.0" y="118.0" width="136.0" height="64.0" rx="8" fi