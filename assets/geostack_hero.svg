b" text-anchor="middle" font-weight="700">retrieve</text><text x="484.0" y="400.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">radtrax · matched filter, OE</text><rect x="573.0" y="362.0" width="150.0" height="58.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="648.0" y="384.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">grid + gap-fill</text><text x="648.0" y="400.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">pyrox · geonnax</text><text x="648.0" y="413.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">vardax OI</text><rect x="737.0" y="362.0" width="150.0" height="58.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="812.0" y="384.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">model + assimilate</text><text x="812.0" y="400.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">somax · plumax</text><text x="812.0" y="413.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">vardax · filterax</text><rect x="901.0" y="362.0" width="150.0" height="58.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="976.0" y="384.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">derive</text><text x="976.0" y="400.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">xtremax</text><rect x="312.0" y="432.0" width="814.0" height="26.0" rx="13" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/><text x="719.0" y="449.0" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="600">every step climbs the same ladder: simple model → trusted oracle (DA / inversion) → emulator → amortized inference</text><rect x="312.0" y="464.0" width="814.0" height="26.0" rx="13" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/><text x="719.0" y="481.0" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">GeoNumer